  <div class="card">
    <h2>Agregar rol</h2>
    <p class="sub">Cuéntanos qué rol buscas.</p>
    <div id="form">
    <label for="w">¿Quién eres?</label>
    <input id="w" maxlength="60" placeholder="Tu rol" autocomplete="off">
    <label for="c">¿Qué personaje buscas?</label>
    <input id="c" maxlength="80" placeholder="Ej: Rukia">
    <label for="f">¿Fandom del rol buscado?</label>
    <input id="f" maxlength="80" placeholder="Ej: Bleach">
    <label for="x">Mensaje extra (opcional)</label>
    <textarea id="x" maxlength="500" placeholder="Algo más que quieras decir..."></textarea>
    <span class="cnt" id="cnt">0/500</span>
    <button id="send" type="button">Enviar</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <div class="tools" id="tools" hidden>
    <select id="fsel" aria-label="Filtrar por fandom"></select>
    <input id="q" type="search" placeholder="Buscar..." aria-label="Buscar por personaje o usuario">
  </div>
  <div id="list"><p class="sub">Cargando...</p></div>
<div style="text-align:center;margin-top:10px"><button id="own" class="lnk" type="button" style="opacity:.55">🔒 Solo para la owner</button></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,addDoc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAfQgUrcZXDFCafFnbQ2dzNwreqfjvx4k8",authDomain:"kawsay-79f2a.firebaseapp.com",projectId:"kawsay-79f2a",storageBucket:"kawsay-79f2a.firebasestorage.app",messagingSenderId:"652834277960",appId:"1:652834277960:web:339f60fb62cbed8902e67d"};
const OWNER="titx81@gmail.com";
const fapp=initializeApp(firebaseConfig),fdb=getFirestore(fapp),auth=getAuth(fapp);
(function(){
  var $=function(i){return document.getElementById(i)};
  var st=$('status'),btn=$('send'),cnt=$('cnt'),list=$('list'),tools=$('tools'),sel=$('fsel'),q=$('q'),stats=$('stats');
  var wEl=$('w'),cEl=$('c'),fEl=$('f'),xEl=$('x');
  var db=null,uid=null,isOwner=false,all=[],seen={},nIdx=0,RC={},RM={},busyR=false,rolesLoaded=false,stamped={},rdocs=[];
  var KEY='rol-buscado-nombre',MAX=30;

  var RMO=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function animNum(b,to){
    var from=+b.dataset.v||0;b.dataset.v=to;
    if(RMO||from===to){b.textContent=to;return}
    var t0=performance.now();
    (function step(t){var k=Math.min(1,(t-t0)/600);b.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(step)})(t0);
  }
  function burst(node){
    if(RMO)return;
    var r=node.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,G=['❀','✿','❁','✾','❃'];
    for(var i=0;i<14;i++){
      var sp=document.createElement('span'),a=Math.PI*2*i/14+Math.random()*.4,d=60+Math.random()*60;
      sp.className='pb';sp.textContent=G[i%G.length];
      sp.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+(14+Math.random()*12)+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px';
      document.body.appendChild(sp);setTimeout(sp.remove.bind(sp),1000);
    }
  }
  function floatEm(node,em){
    if(RMO)return;
    var r=node.getBoundingClientRect(),sp=document.createElement('span');
    sp.className='fe';sp.textContent=em;sp.style.left=(r.left+r.width/2)+'px';sp.style.top=r.top+'px';
    document.body.appendChild(sp);setTimeout(sp.remove.bind(sp),1000);
  }
  function say(t,c){st.textContent=t;st.className=c||''}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function empty(t){list.textContent='';tools.hidden=true;stats.hidden=true;list.appendChild(el('p','sub',t))}
  function norm(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
  function ago(ts){
    var s=Math.round((ts-Date.now())/1000),a=Math.abs(s);
    try{
      var r=new Intl.RelativeTimeFormat('es',{numeric:'auto'});
      if(a<60)return 'hace un momento';
      if(a<3600)return r.format(Math.round(s/60),'minute');
      if(a<86400)return r.format(Math.round(s/3600),'hour');
      if(a<2592000)return r.format(Math.round(s/86400),'day');
    }catch(_){}
    return new Date(ts).toLocaleDateString('es');
  }

  function store(v){try{if(v==null)return localStorage.getItem(KEY)||'';localStorage.setItem(KEY,v)}catch(_){return ''}}
  xEl.addEventListener('input',function(){cnt.textContent=xEl.value.length+'/500'});
  [wEl,cEl,fEl].forEach(function(i){i.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();submit()}})});

  (function(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    var G=['❀','✿','❁','✾','❃'],R=Math.random;
    function mk(host,n,fn){for(var i=0;i<n;i++){var s=document.createElement('span');s.textContent=G[Math.floor(R()*G.length)];fn(s);host.appendChild(s)}}
    mk($('petals'),16,function(s){
      s.style.left=R()*100+'%';s.style.fontSize=(12+R()*16)+'px';
      s.style.opacity=(.12+R()*.2).toFixed(2);
      s.style.animationDuration=(11+R()*10)+'s';s.style.animationDelay=(-R()*20)+'s';
      s.style.setProperty('--sx',(R()*80-40)+'px');
    });
    mk($('up'),9,function(s){
      s.style.left=(4+R()*92)+'%';s.style.fontSize=(10+R()*10)+'px';
      s.style.animationDuration=(4+R()*4)+'s';s.style.animationDelay=(-R()*8)+'s';
    });
  })();

  var timer=setTimeout(function(){empty('No se pudo cargar el tablón.')},10000);

  /* Lista de fandoms (sin duplicados por mayúsculas o tildes) */
  function buildFandoms(){
    var m={},cur=sel.value;
    all.forEach(function(r){var k=norm(r.e.fandom);if(!m[k])m[k]={l:r.e.fandom,n:0};m[k].n++});
    var keys=Object.keys(m).sort(function(a,b){return m[a].l.localeCompare(m[b].l,'es')});
    sel.textContent='';
    var o=el('option',null,'Todos los fandoms');o.value='';sel.appendChild(o);
    keys.forEach(function(k){var op=el('option',null,m[k].l+' ('+m[k].n+')');op.value=k;sel.appendChild(op)});
    sel.value=m[cur]?cur:'';
  }

  function updateStats(){
    var f={},found=0,today=0,n=Date.now();
    all.forEach(function(r){f[norm(r.e.fandom)]=1;if(r.e.found)found++;if(n-r.e.ts<864e5)today++});
    var v=[all.length,Object.keys(f).length,found,today];
    Array.prototype.forEach.call(stats.querySelectorAll('b'),function(b,i){animNum(b,v[i])});
    stats.hidden=false;
  }

  function armDelete(d,r){
    if(!d.dataset.arm){
      d.dataset.arm='1';d.textContent='¿Seguro?';
      setTimeout(function(){if(d.isConnected){delete d.dataset.arm;d.textContent='Borrar'}},3000);
      return;
    }
    d.disabled=true;
    deleteDoc(doc(fdb,'buscados',r.id)).catch(function(){d.disabled=false;say('No se pudo borrar. Intenta de nuevo.','err')});
  }

  function rxRow(k){
    var rx=el('div','rx');
    ['🔥','💖','👀'].forEach(function(em){
      var n=(RC[k]&&RC[k][em])||0,on=!!(RM[k]&&RM[k][em]);
      var bt=el('button','rb'+(on?' on':''),em+(n?' '+n:''));
      bt.type='button';bt.setAttribute('aria-pressed',on?'true':'false');
      bt.setAttribute('aria-label',({'🔥':'Fuego','💖':'Corazón','👀':'Ojos'})[em]+(n?' ('+n+')':''));
      bt.addEventListener('click',function(){if(uid&&!on)floatEm(bt,em);react(k,em)});
      rx.appendChild(bt);
    });
    return rx;
  }
  function react(k,em){
    if(!uid){say('Conectando... intenta de nuevo en un momento.','err');return}
    if(busyR)return;
    busyR=true;
    var ref=doc(fdb,'reacciones',uid);
    getDoc(ref).then(function(d){
      var m=Object.assign({},(d.exists()&&d.data().r)||{}),a=(m[k]||[]).slice(),i=a.indexOf(em);
      if(i>=0)a.splice(i,1);else a.push(em);
      if(a.length)m[k]=a;else delete m[k];
      return setDoc(ref,{r:m});
    }).catch(function(){say('No se pudo reaccionar. Intenta de nuevo.','err')}).then(function(){busyR=false});
  }
  function markFound(d,r){
    d.disabled=true;
    updateDoc(doc(fdb,'buscados',r.id),{found:r.e.found?0:Date.now()}).catch(function(){d.disabled=false;say('No se pudo actualizar. Intenta de nuevo.','err')});
  }
  function calcR(){
    RC={};RM={};
    rdocs.forEach(function(x){var m=x.r||{};Object.keys(m).forEach(function(k){(m[k]||[]).forEach(function(em){var c=RC[k]=RC[k]||{};c[em]=(c[em]||0)+1;if(x.id===uid)(RM[k]=RM[k]||{})[em]=1})})});
  }
  function post(r){
    var e=r.e,k=r.id,wrap=el('div','post');
    if(!seen[k]){seen[k]=1;wrap.classList.add('in');wrap.style.animationDelay=Math.min(nIdx++,10)*70+'ms'}
    var b=el('div','bub'),side=el('div','side'),bd=el('div','body'),top=el('div','top'),h=el('div','ttl');
    side.appendChild(el('span','av',(Array.from(String(e.who).trim())[0]||'?').toUpperCase()));
    top.appendChild(el('span','num','#'+(r.n||'')));
    if(Date.now()-e.ts<864e5)top.appendChild(el('span','new','✦ nuevo'));
    h.appendChild(document.createTextNode('Se busca a '));h.appendChild(el('b',null,e.char));
    bd.appendChild(el('span','nm',e.who));bd.appendChild(top);bd.appendChild(h);bd.appendChild(el('span','chip','✿ '+e.fandom));
    b.appendChild(side);b.appendChild(bd);
    if(e.msg){var m=el('div','msg','“'+e.msg+'”');bd.appendChild(m)}
    var foot=el('div','foot'),tm=el('small',null,ago(e.ts));
    tm.title=new Date(e.ts).toLocaleString();
    foot.appendChild(tm);
    if(uid&&(e.uid===uid||isOwner)){
      var acts=el('div','acts'),f=el('button','act',e.found?'↺ Reabrir':'✓ Encontrado');
      f.type='button';f.addEventListener('click',function(){markFound(f,r)});
      var d=el('button','del','Borrar');d.type='button';
      d.addEventListener('click',function(){armDelete(d,r)});
      acts.appendChild(f);if(isOwner)acts.appendChild(d);foot.appendChild(acts);
    }
    bd.appendChild(rxRow(k));bd.appendChild(foot);
    if(e.found){b.classList.add('found');b.appendChild(el('div','stamp'+(stamped[k]?'':' pop'),'ENCONTRADO'));stamped[k]=1}
    wrap.appendChild(b);list.appendChild(wrap);
  }

  function render(){
    if(!all.length){empty('Aún no hay roles. ¡Sé la primera persona!');return}
    tools.hidden=false;updateStats();
    var fk=sel.value,term=norm(q.value);
    var rows=all.filter(function(r){
      var e=r.e;
      if(fk&&norm(e.fandom)!==fk)return false;
      if(term&&norm(e.char+' '+e.who+' '+e.fandom).indexOf(term)<0)return false;
      return true;
    });
    list.textContent='';
    if(!rows.length){list.appendChild(el('p','sub','Nada coincide con tu búsqueda.'));return}
    nIdx=0;rows.forEach(post);
  }
  sel.addEventListener('change',render);
  q.addEventListener('input',render);

  function valid(r){var e=r.e;return e&&e.who&&e.char&&e.fandom}
  onSnapshot(collection(fdb,'reacciones'),function(sn){
    rdocs=sn.docs.map(function(d){return{id:d.id,r:(d.data()||{}).r}});
    calcR();if(rolesLoaded)render();
  },function(){});
  onSnapshot(collection(fdb,'buscados'),function(sn){
    clearTimeout(timer);
    all=sn.docs.map(function(d){return{e:Object.assign({},d.data(),{id:d.id}),id:d.id}}).filter(valid);
    all.sort(function(a,b){return b.e.ts-a.e.ts});
    all.forEach(function(r,i){r.n=all.length-i});
    all.sort(function(a,b){return (a.e.found?1:0)-(b.e.found?1:0)});
    buildFandoms();rolesLoaded=true;render();
  },function(){clearTimeout(timer);empty('No se pudo cargar el tablón.')});
  onAuthStateChanged(auth,function(u){
    if(!u){uid=null;isOwner=false;signInAnonymously(auth).catch(function(){say('No se pudo conectar.','err')});return}
    uid=u.uid;isOwner=!u.isAnonymous&&u.email===OWNER&&u.emailVerified;
    $('own').textContent=isOwner?'Salir (owner)':'🔒 Solo para la owner';
    calcR();if(rolesLoaded)render();
  });
  $('own').addEventListener('click',function(){
    if(isOwner){signOut(auth);return}
    signInWithPopup(auth,new GoogleAuthProvider()).then(function(r){
      if(r.user.email!==OWNER){signOut(auth);say('Esta cuenta no es la owner.','err')}
    }).catch(function(){say('No se pudo iniciar sesión.','err')});
  });

  function submit(){
    if(btn.disabled)return;
    var who=wEl.value.trim(),ch=cEl.value.trim(),fa=fEl.value.trim(),xm=xEl.value.trim();
    if(!who||!ch||!fa){say('Responde las tres preguntas.','err');return}
    if(!uid){say('Conectando... intenta de nuevo en un momento.','err');return}
    if(all.some(function(r){return r.e.uid===uid&&norm(r.e.char)===norm(ch)&&norm(r.e.fandom)===norm(fa)})){say('Ya publicaste ese personaje en ese fandom.','err');return}
    if(all.filter(function(r){return r.e.uid===uid}).length>=MAX){say('Llegaste al límite de '+MAX+' roles. Pídele a la owner que borre alguno.','err');return}
    btn.disabled=true;say('Enviando...');
    addDoc(collection(fdb,'buscados'),{uid:uid,who:who,char:ch,fandom:fa,msg:xm,ts:Date.now(),found:0}).then(function(){
      wEl.value='';cEl.value='';fEl.value='';xEl.value='';cnt.textContent='0/500';
      say('¡Enviado! ✿','ok');burst(btn);btn.disabled=false;
    }).catch(function(e){
      say('No se pudo enviar ('+((e&&e.code)||'error')+'). Intenta de nuevo.','err');btn.disabled=false;
    });
  }
  btn.addEventListener('click',submit);
  $('enter').addEventListener('click',function(){
    burst($('enter'));
    document.body.classList.remove('gate');document.body.classList.add('entered');window.scrollTo(0,0);
    Array.prototype.forEach.call(stats.querySelectorAll('b'),function(b){b.dataset.v=0});
    if(all.length)updateStats();
  });
})();
</script>
</body>
</html>
